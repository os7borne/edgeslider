name: Feature request
description: An idea for EdgeSlider
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        EdgeSlider is deliberately tiny. Ideas that fit well are other things with a level or a few steps that could live on a trackpad edge. Anything needing new permissions, dependencies or a network connection needs a strong reason.
  - type: textarea
    id: idea
    attributes:
      label: What would you like it to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is that useful to you?
